<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
      }
      #e {
        width: 1280px;
        height: 720px;
        position: relative;
        overflow: hidden;
        background: #02213a url(the-pool-background-caustics-2560x1600.jpg)
          center/1600px auto;
      }
      #e .v {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          #02213a40 25%,
          #02213ad8 100%
        );
      }
      #e .logo {
        position: absolute;
        left: 50%;
        top: 50%;
        height: 540px;
        transform: translate(-50%, -52%);
        filter: drop-shadow(0 10px 30px #000b);
      }
      .d {
        position: absolute;
        filter: drop-shadow(0 6px 12px #000b);
      }
    </style>
  </head>
  <body>
    <div id="e">
      <div class="v"></div>
      <img
        class="d"
        src="c45-2-exploded-skimmer.png"
        style="left: 40px; top: 40px; height: 330px; transform: rotate(-6deg)"
      />
      <img
        class="d"
        src="c12-2-sand-filter.png"
        style="left: 70px; top: 390px; height: 290px; transform: rotate(4deg)"
      />
      <img
        class="d"
        src="c01-2-boiler-cutaway.png"
        style="left: 960px; top: 50px; height: 170px; transform: rotate(5deg)"
      />
      <img
        class="d"
        src="c56-2-centrifugal-pump.png"
        style="left: 950px; top: 250px; height: 170px; transform: rotate(-4deg)"
      />
      <img
        class="d"
        src="c23-2-balance-tank.png"
        style="left: 960px; top: 470px; height: 170px; transform: rotate(3deg)"
      />
      <img class="logo" src="the-pool-logo-titled.svg" />
    </div>
  </body>
</html>
