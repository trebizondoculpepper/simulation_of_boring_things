<html>
  <body style="margin: 0; background: #000">
    <canvas id="c"></canvas>
    <script>
      // Pool caustics: a cellular (Worley) web, two warped layers, light on deep blue.
      const W = +location.hash.slice(1).split('x')[0] || 2560,
        H = +location.hash.slice(1).split('x')[1] || 1600;
      const cv = document.getElementById('c');
      cv.width = W;
      cv.height = H;
      const c = cv.getContext('2d');
      const img = c.createImageData(W, H),
        d = img.data;
      function hash(x, y, s) {
        let h = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453;
        return h - Math.floor(h);
      }
      function web(px, py, s) {
        const ix = Math.floor(px),
          iy = Math.floor(py);
        let f1 = 9,
          f2 = 9;
        for (let j = -1; j <= 1; j++)
          for (let i = -1; i <= 1; i++) {
            const cx = ix + i + hash(ix + i, iy + j, s),
              cy = iy + j + hash(iy + j, ix + i, s + 3.1);
            const dx = cx - px,
              dy = cy - py,
              dd = dx * dx + dy * dy;
            if (dd < f1) {
              f2 = f1;
              f1 = dd;
            } else if (dd < f2) f2 = dd;
          }
        return Math.sqrt(f2) - Math.sqrt(f1);
      }
      const scale = 150 / 1; // pixels per cell
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          const u = x / scale,
            v = y / scale;
          const wx = u + 0.35 * Math.sin(v * 1.7 + u * 0.6),
            wy = v + 0.35 * Math.sin(u * 1.3 - v * 0.4);
          const a = web(wx, wy, 1),
            b = web(wx * 1.9 + 5.3, wy * 1.9 - 2.1, 7);
          const l =
            Math.pow(Math.max(0, 1 - a * 5.5), 3) * 0.9 +
            Math.pow(Math.max(0, 1 - b * 6), 3) * 0.45;
          const depth =
            0.85 + 0.15 * Math.sin((x / W) * 3.1) * Math.cos((y / H) * 2.3);
          const i = (y * W + x) * 4;
          d[i] = Math.min(255, (8 + l * 150) * depth);
          d[i + 1] = Math.min(255, (70 + l * 175) * depth);
          d[i + 2] = Math.min(255, (110 + l * 150) * depth);
          d[i + 3] = 255;
        }
      c.putImageData(img, 0, 0);
    </script>
  </body>
</html>
