name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes one still queued.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The commit pushed, with all its history and tags: the build derives
      # its version from them (mission 104) and fails without them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Only a release changes the version: every pushed commit checked.
      - name: Check no commit changed the version outside a release
        if: github.event_name == 'push'
        run: node scripts/version-guard.ts "${{ github.event.before }}" "${{ github.sha }}"
      - name: Check this pull request's commits likewise
        if: github.event_name == 'pull_request'
        run: node scripts/version-guard.ts "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The build's name on the title screen: the commit and the date.
      - name: Name the build
        run: echo "VITE_BUILD=$(git rev-parse --short HEAD) · $(date -u +'%-d %b %Y')" >> "$GITHUB_ENV"
      # At the next patch, derived; it writes and commits nothing.
      - run: npm run build
      # The built site, for the deploy job; only pushes to main deploy.
      # GitHub Pages is the bleeding edge; only a release reaches itch.io
      # (release.yml; the owner, 2026-10-28).
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
