name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes one still queued.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history and its tags, to number the version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Every build its own version: package.json's MAJOR.MINOR.PATCH, the
      # patch advanced by the commits since that version's tag (README,
      # "Versions and releases"). Nothing is committed back to main.
      - name: Number the version
        run: |
          base="$(node -p "require('./package.json').version")"
          if count="$(git rev-list --count "v${base}..HEAD" 2>/dev/null)"; then :; else
            echo "::warning::No tag v${base}: the version is not advanced"
            count=0
          fi
          IFS=. read -r major minor patch <<< "${base%%-*}"
          version="${major}.${minor}.$((patch + count))"
          echo "VITE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Version ${version}"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The build's name on the title screen: the commit and the date.
      - name: Name the build
        run: echo "VITE_BUILD=$(git rev-parse --short HEAD) · $(date -u +'%-d %b %Y')" >> "$GITHUB_ENV"
      - run: npm run build
      # The built site, for the deploy job; only pushes to main deploy.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
