name: Release

# A release is an annotated tag vMAJOR.MINOR.PATCH on main, made and pushed
# by `npm run release` (the next minor; a major only when the owner asks;
# mission 104, see the README). It is the only way to itch.io: GitHub
# Pages follows every push to main, itch.io carries releases.
# A failed release is published again, from main's workflow, with
# `gh workflow run release.yml -f tag=vX.Y.Z`: the same checks, on the tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The existing release tag to publish (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Check the tag and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag's name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${TAG} is not a release tag vX.Y.Z" >&2
            exit 1
          fi
      # All the history and tags, to check where the tag points.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: refs/tags/${{ env.TAG }}
      # actions/checkout fetches the tag it checks out a second time, as a
      # lightweight ref straight to the commit, losing the annotation; fetch
      # the tag object itself again so the checks below see it as it is.
      - name: Fetch the tag as it is on origin
        run: git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The tag must be annotated, on the commit built, that commit on
      # main, and the version in package.json and both of the lockfile's
      # fields, with its changelog section.
      - name: Check the tag against main, package.json, the lockfile and CHANGELOG.md
        run: |
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]; then
            echo "Tag ${TAG} is not annotated (made by npm run release?)" >&2
            exit 1
          fi
          if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag ${TAG} does not point at the commit checked out" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${TAG} is not on main" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          lock="$(node -p "const l=require('./package-lock.json'); l.version + ' ' + l.packages[''].version")"
          if [ "${TAG}" != "v${version}" ] || [ "${lock}" != "${version} ${version}" ]; then
            echo "Tag ${TAG} does not match package.json ${version} and the lockfile ${lock}" >&2
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Name the build
        run: echo "VITE_BUILD=$(git rev-parse --short HEAD) · $(date -u +'%-d %b %Y')" >> "$GITHUB_ENV"
      # A tagged release is rebuilt at the tag's exact version.
      - run: npm run build -- --release
      # The desktop jobs below wrap exactly this build.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      # The release's notes are its changelog section; a pre-release
      # version (with a hyphen) is marked as one.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # GitHub takes at most 125000 characters of notes: a longer
          # section is cut at a line and points to the changelog itself.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            head -c 120000 notes.md | sed '$d' > notes.cut
            printf '\n…\n\nThe full notes are in [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> notes.cut
            mv notes.cut notes.md
          fi
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; publishing it again goes on to itch.io"
            exit 0
          fi
          gh release create "$TAG" --title "Pool Plant $TAG" --notes-file notes.md "${flags[@]}"
      # butler, itch.io's uploader, logs in with the BUTLER_API_KEY secret.
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          echo "$PWD/butler" >> "$GITHUB_PATH"
      - name: Push the release to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set: the release cannot reach itch.io" >&2
            exit 1
          fi
          butler push dist salimfadhley/the-pool:html5 --userversion "${TAG#v}"

  # The desktop app (mission 111): the release's web build in Electron,
  # packaged on each platform and attached to the GitHub release. File
  # names carry no version, so releases/latest/download/<name> always
  # fetches the newest. Unsigned until signing is set up (mission 110,
  # stage 4). Publishing a release again replaces its files (--clobber).
  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Package the desktop app
        working-directory: desktop
        env:
          # No signing yet: electron-builder must not look for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run compile
          npx electron-builder --config electron-builder.yml --publish never \
            ${{ matrix.platform }} --config.extraMetadata.version="${TAG#v}"
      - name: List the files to publish
        id: files
        working-directory: desktop/release
        run: |
          shopt -s nullglob
          files=(The-Pool-*.AppImage The-Pool-*.tar.gz The-Pool-*.dmg The-Pool-*.zip The-Pool-*-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "electron-builder made nothing to publish" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if command -v sha256sum > /dev/null; then sha256sum "${files[@]}"; else shasum -a 256 "${files[@]}"; fi > "SHA256SUMS-${{ runner.os }}.txt"
          {
            echo 'paths<<EOF'
            printf 'desktop/release/%s\n' "${files[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.files.outputs.paths }}
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files <<< "${{ steps.files.outputs.paths }}"
          gh release upload "$TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ runner.os }}
          path: desktop/release/SHA256SUMS-${{ runner.os }}.txt

  # One checksum file for every desktop file on the release.
  checksums:
    name: Desktop checksums
    needs: desktop
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sums-*
          merge-multiple: true
      - name: Attach SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
